name: BAGEL-BE-CI

# 모노레포: backend/ 변경이 있는 PR·main push에서 백엔드 빌드와 테스트만 실행한다 (#132)
# 테스트는 @ActiveProfiles("test") + H2라 운영 설정·DB 없이 돈다
on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/BACKEND-*.yaml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/BACKEND-*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Gradle Wrapper 실행권한 부여
        run: chmod +x gradlew

      - name: 빌드와 테스트
        run: ./gradlew clean build
