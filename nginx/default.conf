# 프론트 정적 서빙: SPA 라우트 폴백, 압축, 자원별 캐시 (#131)
server {
    # Dockerfile EXPOSE·FRONTEND-CICD 포트 매핑과 짝
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # 텍스트 자원 gzip (이미지 webp·오디오 m4a 는 이미 압축됨)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 빌드 해시가 붙은 js·css: 내용이 바뀌면 이름도 바뀜 > 1년 캐시
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 게임 이미지·오디오: 이름 고정 > 7일 캐시
    location ~ ^/(img|audio)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html: 항상 재검증 (배포 직후 새 청크 이름을 받기 위해)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
